<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VAT - совместный просмотр видео и аудио">
  <meta name="theme-color" content="#0f0f0f">
  <title>VAT — Совместный просмотр</title>
  <style>
    :root {
      --bg-primary: #0f0f0f;
      --bg-secondary: #1a1a1a;
      --bg-tertiary: #2a2a2a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --accent: #4a9eff;
      --accent-hover: #3a8eef;
      --danger: #ff4a4a;
      --success: #4aff7a;
      --warning: #ffb74a;
      --border: #333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.5;
    }
    button, input { font-family: inherit; }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    .hidden { display: none !important; }

    #browser-warning {
      background: var(--warning);
      color: #000;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }

    .login-screen {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: var(--bg-secondary);
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      border: 1px solid var(--border);
    }
    .login-card h1 { margin-bottom: 8px; font-size: 28px; }
    .login-card p { color: var(--text-secondary); margin-bottom: 24px; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: var(--text-secondary); }
    .form-group input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 15px;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }

    .btn { padding: 10px 16px; border: none; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--bg-tertiary); color: var(--text-secondary); cursor: not-allowed; }
    .btn-secondary { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); width: auto; }
    .btn-secondary:hover { border-color: var(--accent); }
    .error-message {
      background: rgba(255, 74, 74, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 14px;
    }

    .room-screen { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .room-header {
      background: var(--bg-secondary);
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .room-header h2 { font-size: 18px; }
    .room-code {
      font-family: 'Courier New', monospace;
      background: var(--bg-tertiary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 14px;
      margin-left: 10px;
    }
    .room-content { flex: 1; display: grid; grid-template-columns: 1fr 320px; overflow: hidden; }
    .media-area { display: flex; flex-direction: column; background: #000; }
    #video-player { flex: 1; width: 100%; background: #000; max-height: calc(100vh - 220px); }

    .download-panel { background: var(--bg-secondary); padding: 12px 20px; border-top: 1px solid var(--border); }
    .download-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 14px; }
    .download-progress { height: 8px; background: var(--bg-tertiary); border-radius: 4px; overflow: hidden; }
    .download-progress-fill { height: 100%; background: var(--success); width: 0%; transition: width 0.3s; }
    .download-stats { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--text-secondary); }

    .controls { background: var(--bg-secondary); padding: 12px 20px; border-top: 1px solid var(--border); }
    .controls-row { display: flex; align-items: center; gap: 12px; }
    .icon-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--accent); }
    #progress-bar { flex: 1; height: 6px; background: var(--bg-tertiary); border-radius: 3px; cursor: pointer; }
    #progress-fill { height: 100%; background: var(--accent); border-radius: 3px; width: 0%; }
    .time-display { font-size: 13px; color: var(--text-secondary); font-family: 'Courier New', monospace; min-width: 90px; }

    .sidebar { background: var(--bg-secondary); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tab-btn { flex: 1; padding: 10px; background: transparent; border: none; color: var(--text-secondary); font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-content { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; }

    .participants-list { list-style: none; }
    .participant { padding: 8px; border-radius: 6px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
    .participant.online { background: var(--bg-tertiary); }
    .participant.offline { opacity: 0.5; }
    .role-badge { font-size: 10px; padding: 2px 6px; border-radius: 3px; background: var(--accent); color: #fff; }
    .role-badge.temp { background: var(--warning); color: #000; }
    .participant-progress { margin-left: auto; font-size: 12px; color: var(--text-secondary); }

    .chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; }
    .chat-message { margin-bottom: 10px; font-size: 14px; }
    .chat-message .sender { font-weight: 600; color: var(--accent); margin-right: 6px; }
    .chat-message .time { font-size: 11px; color: var(--text-secondary); margin-left: 6px; }
    .chat-input-area { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .chat-input-area input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 14px;
    }
    .chat-input-area button { padding: 8px 16px; background: var(--accent); border: none; border-radius: 6px; color: #fff; font-size: 14px; cursor: pointer; }

    .status-overlay {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      max-width: 320px;
      z-index: 1000;
    }
    .status-overlay.success { border-color: var(--success); }
    .status-overlay.error { border-color: var(--danger); }
    .status-overlay.warning { border-color: var(--warning); }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal { background: var(--bg-secondary); padding: 30px; border-radius: 12px; max-width: 500px; width: 90%; border: 1px solid var(--border); }
    .modal h3 { margin-bottom: 12px; }
    .modal p { color: var(--text-secondary); margin-bottom: 20px; font-size: 14px; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

    @media (max-width: 768px) {
      .room-content { grid-template-columns: 1fr; }
      .sidebar { max-height: 40vh; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal-root"></div>
  <!-- Load WebTorrent browser bundle globally before the app starts -->
  <script src="/webtorrent.min.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
